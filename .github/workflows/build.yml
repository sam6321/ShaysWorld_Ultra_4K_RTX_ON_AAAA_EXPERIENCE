name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Official LunarG SDK (prebuilt glslangValidator) — avoids building Glslang
      # from source, which keeps failing ENABLE_OPT / SPIRV-Tools configure.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Verify toolchain
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "VULKAN_SDK_VERSION=$env:VULKAN_SDK_VERSION"
          if (-not $env:VULKAN_SDK) { throw "VULKAN_SDK not set" }
          Get-Command glslangValidator -ErrorAction Stop
          glslangValidator -v
          cmake --version

      - name: Configure
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          # windows-latest is VS 2026 (generator 18) as of June 2026.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ver = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          Write-Host "VS installationVersion=$ver"
          $gen = if ($ver -like "18.*") { "Visual Studio 18 2026" } else { "Visual Studio 17 2022" }
          Write-Host "Using generator: $gen"
          cmake -S . -B build -G $gen -A x64

      - name: Build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --config Release --target shays_vk --parallel

      - name: Package zip
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --config Release --target package_release
          Get-Item build/dist/shays-world-vk-windows.zip | Format-List FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shays-world-vk-windows
          path: build/dist/shays-world-vk-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/shays-world-vk-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
