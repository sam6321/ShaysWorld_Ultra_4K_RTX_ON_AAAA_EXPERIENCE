name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          # Glslang ENABLE_OPT requires SPIRV-Tools (+ Headers) at configure time.
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools, SPIRV-Headers
          vulkan-use-cache: true

      - name: Verify glslangValidator
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Get-Command glslangValidator -ErrorAction Stop
          glslangValidator -v

      - name: Configure
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --config Release --target shays_vk --parallel

      - name: Package zip
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --config Release --target package_release
          Get-Item build/dist/shays-world-vk-windows.zip | Format-List FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shays-world-vk-windows
          path: build/dist/shays-world-vk-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/shays-world-vk-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
